<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixel Base</title>
    <style>
      :root {
        color-scheme: dark;
        --pb-bg: #141821;
        --pb-panel: rgba(13, 16, 24, 0.82);
        --pb-line: rgba(255, 255, 255, 0.14);
        --pb-fg: #e8ebf3;
        --pb-dim: #9aa3b8;
        --pb-accent: #f0b35a;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--pb-bg);
        color: var(--pb-fg);
        font: 12px/1.3 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      #view {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        cursor: grab;
        touch-action: none;
      }
      #view.drag {
        cursor: grabbing;
      }
      .chip {
        position: absolute;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 5px 9px;
        background: var(--pb-panel);
        border: 1px solid var(--pb-line);
        border-radius: 6px;
        backdrop-filter: blur(4px);
        user-select: none;
      }
      #title {
        top: 8px;
        left: 8px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      #title b {
        color: var(--pb-accent);
      }
      #title small {
        font-weight: 400;
        letter-spacing: 0;
        color: var(--pb-dim);
      }
      #tools {
        right: 8px;
        bottom: 8px;
        padding: 3px;
      }
      #tools button {
        min-width: 28px;
        height: 26px;
        padding: 0 7px;
        color: var(--pb-fg);
        background: transparent;
        border: 1px solid transparent;
        border-radius: 4px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      #tools button:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: var(--pb-line);
      }
      #tools button:focus-visible {
        outline: 2px solid var(--pb-accent);
        outline-offset: 1px;
      }
      #zoom {
        min-width: 40px;
        text-align: center;
        color: var(--pb-dim);
        font-variant-numeric: tabular-nums;
      }
      #tools .sep {
        width: 1px;
        height: 16px;
        background: var(--pb-line);
      }
      #tools #demo {
        color: var(--pb-dim);
        font-size: 11px;
        letter-spacing: 0.06em;
      }
      #tools #demo.on {
        color: var(--pb-accent);
        border-color: rgba(240, 179, 90, 0.45);
      }
      /* --- docks: AGENTS (left), USAGE (right), ACTIVITY (bottom left), all foldable --- */
      .dock {
        position: absolute;
        display: flex;
        flex-direction: column;
        width: 224px;
        max-width: calc(100% - 16px);
        background: var(--pb-panel);
        border: 1px solid var(--pb-line);
        border-radius: 8px;
        backdrop-filter: blur(4px);
        overflow: hidden;
      }
      #dock-agents {
        top: 44px;
        left: 8px;
        max-height: calc(60% - 44px);
      }
      #dock-usage {
        top: 8px;
        right: 8px;
        max-height: calc(100% - 60px);
      }
      #dock-activity {
        left: 8px;
        bottom: 44px;
        width: 280px;
        max-height: 30%;
      }
      .dock-head {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: none;
        width: 100%;
        padding: 7px 10px;
        color: var(--pb-fg);
        background: transparent;
        border: 0;
        font: inherit;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-align: left;
        cursor: pointer;
      }
      .dock-head:hover {
        background: rgba(255, 255, 255, 0.06);
      }
      .dock-head:focus-visible {
        outline: 2px solid var(--pb-accent);
        outline-offset: -2px;
      }
      .dock-count {
        margin-left: auto;
        color: var(--pb-dim);
        font-weight: 400;
        font-size: 11px;
        letter-spacing: 0;
        white-space: nowrap;
      }
      .chev {
        color: var(--pb-dim);
        font-size: 10px;
        transition: transform 0.12s;
      }
      .dock.collapsed .chev {
        transform: rotate(-90deg);
      }
      .dock-body {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 2px 6px 8px;
        border-top: 1px solid var(--pb-line);
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.28) transparent;
      }
      .dock.collapsed .dock-body {
        display: none;
      }
      .dock ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .dock .empty {
        padding: 8px 4px;
        color: var(--pb-dim);
        font-size: 11px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        margin-top: 4px;
        padding: 4px;
        color: var(--pb-fg);
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid transparent;
        border-radius: 6px;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .row:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.1);
      }
      .row:disabled {
        cursor: default;
        opacity: 0.6;
      }
      .row.sel {
        border-color: var(--pb-accent);
      }
      .row:focus-visible,
      .ws:focus-visible {
        outline: 2px solid var(--pb-accent);
        outline-offset: 1px;
      }
      .row .face {
        flex: none;
        width: 40px;
        height: 56px;
        image-rendering: pixelated;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 4px;
      }
      .row .info {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .row .top {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .row .nm {
        font-size: 12px;
        letter-spacing: 0.06em;
      }
      .badge {
        padding: 0 6px;
        color: var(--pb-dim);
        border: 1px solid var(--pb-line);
        border-radius: 8px;
        font-size: 10px;
        line-height: 14px;
      }
      .row .st,
      .act .al::before {
        color: var(--pb-dim);
        font-size: 11px;
      }
      .row .st::before,
      .act .al::before {
        content: '';
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-right: 6px;
        border-radius: 50%;
        background: var(--dot, #9aa3b8);
      }
      .row .tk {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        color: var(--pb-dim);
        font-size: 10px;
      }
      .sub {
        margin: 10px 4px 2px;
        color: var(--pb-dim);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.1em;
      }
      #wsBlock[hidden] {
        display: none;
      }
      .ws {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        padding: 4px;
        color: var(--pb-fg);
        background: transparent;
        border: 0;
        border-radius: 4px;
        font: inherit;
        font-size: 11px;
        text-align: left;
        cursor: pointer;
      }
      .ws:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      .ws .wn {
        flex: none;
        max-width: 90px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-weight: 600;
      }
      .ws .wb {
        min-width: 0;
        flex: 1;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        color: var(--pb-dim);
        font-size: 10px;
      }
      .ws .wc {
        margin-left: auto;
        min-width: 14px;
        color: var(--pb-accent);
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      .totals {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin: 8px 2px 4px;
      }
      .total {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .total .lbl {
        color: var(--pb-dim);
        font-size: 10px;
        letter-spacing: 0.1em;
      }
      .total .big {
        color: var(--pb-accent);
        font-size: 22px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1.15;
      }
      .total .unit {
        color: var(--pb-dim);
        font-size: 10px;
      }
      .kind {
        margin: 8px 2px 0;
      }
      .kind .kh {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 2px 6px;
        font-size: 11px;
      }
      .kind .kn {
        letter-spacing: 0.06em;
      }
      .kind .run {
        color: #6df08a;
        font-size: 10px;
      }
      .kind .kv {
        margin-left: auto;
        color: var(--pb-dim);
        font-size: 10px;
        font-variant-numeric: tabular-nums;
      }
      .bar {
        height: 4px;
        margin-top: 3px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--pb-accent);
      }
      .dock .note,
      .dock .tag {
        margin: 8px 2px 0;
        color: var(--pb-dim);
        font-size: 10px;
        line-height: 1.35;
      }
      .dock .tag {
        color: var(--pb-accent);
        letter-spacing: 0.06em;
      }
      .act {
        display: flex;
        gap: 8px;
        padding: 3px 2px;
        font-size: 11px;
      }
      .act .at {
        flex: none;
        color: var(--pb-dim);
        font-variant-numeric: tabular-nums;
      }
      .act .al {
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .act .al::before {
        color: inherit;
      }
      #card {
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        max-width: calc(100% - 16px);
        align-items: flex-start;
        gap: 10px;
        padding: 8px 10px;
        min-width: 150px;
      }
      #card[hidden] {
        display: none;
      }
      #avatar {
        width: 54px;
        height: 90px;
        flex: none;
        image-rendering: pixelated;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 4px;
      }
      #card .info {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
      }
      #cname {
        font-weight: 700;
        letter-spacing: 0.08em;
        font-size: 13px;
      }
      #cstatus::before {
        content: '';
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-right: 6px;
        border-radius: 50%;
        background: var(--dot, #9aa3b8);
      }
      #card .dim {
        color: var(--pb-dim);
        font-size: 11px;
      }
      #card .task {
        max-width: 190px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      #card [hidden] {
        display: none;
      }
      #card .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 6px;
      }
      /* the `hidden` attribute must win over the display set above */
      #card .actions[hidden],
      #card .msg[hidden] {
        display: none;
      }
      #card .act {
        height: 24px;
        padding: 0 8px;
        font-size: 11px;
      }
      #card .act:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      #card .msg {
        max-width: 190px;
        margin-top: 4px;
        font-size: 11px;
        line-height: 1.3;
        color: var(--pb-dim);
      }
      #card .msg[data-tone='ok'] {
        color: #6df08a;
      }
      #card .msg[data-tone='error'] {
        color: #ff8a8a;
      }
      #card .look {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-top: 4px;
        color: var(--pb-dim);
        font-size: 11px;
      }
      #card .look span {
        min-width: 44px;
        text-align: center;
        color: var(--pb-fg);
      }
      #card button {
        min-width: 22px;
        height: 22px;
        padding: 0 4px;
        color: var(--pb-fg);
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--pb-line);
        border-radius: 4px;
        font: inherit;
        cursor: pointer;
      }
      #card button:hover {
        background: rgba(255, 255, 255, 0.14);
      }
      #card button:focus-visible {
        outline: 2px solid var(--pb-accent);
        outline-offset: 1px;
      }
      #card .x {
        position: absolute;
        top: 3px;
        right: 3px;
        height: 18px;
        min-width: 18px;
        border: 0;
        background: transparent;
        color: var(--pb-dim);
      }
      #status {
        left: 8px;
        bottom: 8px;
        max-width: calc(100% - 288px);
        color: var(--pb-dim);
      }
      #status span {
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      #status i {
        flex: none;
      }
      #status i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #6b7388;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="view" aria-label="Isometric pixel-art office"></canvas>
      <div id="title" class="chip"><b>PIXEL BASE</b> <small>virtual office</small></div>
      <div id="status" class="chip"><i id="statusDot"></i><span id="statusText">Office</span></div>
      <div id="card" class="chip" hidden>
        <canvas id="avatar" width="54" height="90" aria-hidden="true"></canvas>
        <div class="info">
          <div id="cname"></div>
          <div id="cstatus"></div>
          <div id="cwhere" class="dim"></div>
          <div class="dim"><span id="cdesk"></span></div>
          <div id="ckind" class="dim"></div>
          <div id="ctask" class="dim task"></div>
          <div class="look">
            <button id="lprev" aria-label="Previous look">&lsaquo;</button>
            <span id="clook"></span>
            <button id="lnext" aria-label="Next look">&rsaquo;</button>
          </div>
          <div id="cactions" class="actions" hidden>
            <button id="cfocus" class="act">Focus terminal</button>
            <button id="copen" class="act">Open workspace</button>
          </div>
          <div id="cmsg" class="msg" role="status" aria-live="polite" hidden></div>
        </div>
        <button id="cclose" class="x" aria-label="Close profile">&times;</button>
      </div>
      <section id="dock-agents" class="dock" aria-label="Agents">
        <button class="dock-head" aria-expanded="true" aria-controls="agentBody">
          <span>AGENTS</span><span id="count-agents" class="dock-count"></span><span class="chev" aria-hidden="true">&#9662;</span>
        </button>
        <div id="agentBody" class="dock-body">
          <ul id="agentList"></ul>
          <div id="wsBlock" hidden>
            <div class="sub">WORKSPACES</div>
            <ul id="wsList"></ul>
          </div>
        </div>
      </section>
      <section id="dock-usage" class="dock" aria-label="Token usage">
        <button class="dock-head" aria-expanded="true" aria-controls="usageBody">
          <span>USAGE</span><span id="count-usage" class="dock-count"></span><span class="chev" aria-hidden="true">&#9662;</span>
        </button>
        <div id="usageBody" class="dock-body"></div>
      </section>
      <section id="dock-activity" class="dock" aria-label="Activity">
        <button class="dock-head" aria-expanded="true" aria-controls="actBody">
          <span>ACTIVITY</span><span id="count-activity" class="dock-count"></span><span class="chev" aria-hidden="true">&#9662;</span>
        </button>
        <div id="actBody" class="dock-body"><ul id="actList"></ul></div>
      </section>
      <div id="tools" class="chip" role="toolbar" aria-label="Camera">
        <button id="demo" title="Show simulated agents" aria-pressed="true">DEMO</button>
        <span class="sep"></span>
        <button id="zout" title="Zoom out (-)" aria-label="Zoom out">&minus;</button>
        <span id="zoom">100%</span>
        <button id="zin" title="Zoom in (+)" aria-label="Zoom in">+</button>
        <button id="fit" title="Fit office to view (0)">FIT</button>
        <button id="one" title="Actual size">1:1</button>
      </div>
    </div>
    <!--BUNDLE-->
  </body>
</html>
