<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixel Base</title>
    <style>
      :root {
        --pb-bg: #141821;
        --pb-panel: rgba(13, 16, 24, 0.82);
        --pb-line: rgba(255, 255, 255, 0.14);
        --pb-fg: #e8ebf3;
        --pb-dim: #9aa3b8;
        --pb-accent: #f0b35a;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--pb-bg);
        color: var(--pb-fg);
        font: 12px/1.3 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      #view {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        cursor: grab;
        touch-action: none;
      }
      #view.drag {
        cursor: grabbing;
      }
      .chip {
        position: absolute;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 5px 9px;
        background: var(--pb-panel);
        border: 1px solid var(--pb-line);
        border-radius: 6px;
        backdrop-filter: blur(4px);
        user-select: none;
      }
      #title {
        top: 8px;
        left: 8px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      #title b {
        color: var(--pb-accent);
      }
      #title small {
        font-weight: 400;
        letter-spacing: 0;
        color: var(--pb-dim);
      }
      #tools {
        right: 8px;
        bottom: 8px;
        padding: 3px;
      }
      #tools button {
        min-width: 28px;
        height: 26px;
        padding: 0 7px;
        color: var(--pb-fg);
        background: transparent;
        border: 1px solid transparent;
        border-radius: 4px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      #tools button:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: var(--pb-line);
      }
      #tools button:focus-visible {
        outline: 2px solid var(--pb-accent);
        outline-offset: 1px;
      }
      #zoom {
        min-width: 40px;
        text-align: center;
        color: var(--pb-dim);
        font-variant-numeric: tabular-nums;
      }
      #tools .sep {
        width: 1px;
        height: 16px;
        background: var(--pb-line);
      }
      #tools #demo {
        color: var(--pb-dim);
        font-size: 11px;
        letter-spacing: 0.06em;
      }
      #tools #demo.on {
        color: var(--pb-accent);
        border-color: rgba(240, 179, 90, 0.45);
      }
      #card {
        top: 8px;
        right: 8px;
        align-items: flex-start;
        gap: 10px;
        padding: 8px 10px;
        min-width: 150px;
      }
      #card[hidden] {
        display: none;
      }
      #avatar {
        width: 54px;
        height: 90px;
        flex: none;
        image-rendering: pixelated;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 4px;
      }
      #card .info {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
      }
      #cname {
        font-weight: 700;
        letter-spacing: 0.08em;
        font-size: 13px;
      }
      #cstatus::before {
        content: '';
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-right: 6px;
        border-radius: 50%;
        background: var(--dot, #9aa3b8);
      }
      #card .dim {
        color: var(--pb-dim);
        font-size: 11px;
      }
      #card .task {
        max-width: 190px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      #card [hidden] {
        display: none;
      }
      #card .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 6px;
      }
      /* the `hidden` attribute must win over the display set above */
      #card .actions[hidden],
      #card .msg[hidden] {
        display: none;
      }
      #card .act {
        height: 24px;
        padding: 0 8px;
        font-size: 11px;
      }
      #card .act:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      #card .msg {
        max-width: 190px;
        margin-top: 4px;
        font-size: 11px;
        line-height: 1.3;
        color: var(--pb-dim);
      }
      #card .msg[data-tone='ok'] {
        color: #6df08a;
      }
      #card .msg[data-tone='error'] {
        color: #ff8a8a;
      }
      #card .look {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-top: 4px;
        color: var(--pb-dim);
        font-size: 11px;
      }
      #card .look span {
        min-width: 44px;
        text-align: center;
        color: var(--pb-fg);
      }
      #card button {
        min-width: 22px;
        height: 22px;
        padding: 0 4px;
        color: var(--pb-fg);
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--pb-line);
        border-radius: 4px;
        font: inherit;
        cursor: pointer;
      }
      #card button:hover {
        background: rgba(255, 255, 255, 0.14);
      }
      #card button:focus-visible {
        outline: 2px solid var(--pb-accent);
        outline-offset: 1px;
      }
      #card .x {
        position: absolute;
        top: 3px;
        right: 3px;
        height: 18px;
        min-width: 18px;
        border: 0;
        background: transparent;
        color: var(--pb-dim);
      }
      #status {
        left: 8px;
        bottom: 8px;
        max-width: calc(100% - 288px);
        color: var(--pb-dim);
      }
      #status span {
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      #status i {
        flex: none;
      }
      #status i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #6b7388;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="view" aria-label="Isometric pixel-art office"></canvas>
      <div id="title" class="chip"><b>PIXEL BASE</b> <small>virtual office</small></div>
      <div id="status" class="chip"><i id="statusDot"></i><span id="statusText">Office</span></div>
      <div id="card" class="chip" hidden>
        <canvas id="avatar" width="54" height="90" aria-hidden="true"></canvas>
        <div class="info">
          <div id="cname"></div>
          <div id="cstatus"></div>
          <div id="cwhere" class="dim"></div>
          <div class="dim"><span id="cdesk"></span></div>
          <div id="ckind" class="dim"></div>
          <div id="ctask" class="dim task"></div>
          <div class="look">
            <button id="lprev" aria-label="Previous look">&lsaquo;</button>
            <span id="clook"></span>
            <button id="lnext" aria-label="Next look">&rsaquo;</button>
          </div>
          <div id="cactions" class="actions" hidden>
            <button id="cfocus" class="act">Focus terminal</button>
            <button id="copen" class="act">Open workspace</button>
          </div>
          <div id="cmsg" class="msg" role="status" aria-live="polite" hidden></div>
        </div>
        <button id="cclose" class="x" aria-label="Close profile">&times;</button>
      </div>
      <div id="tools" class="chip" role="toolbar" aria-label="Camera">
        <button id="demo" title="Show simulated agents" aria-pressed="true">DEMO</button>
        <span class="sep"></span>
        <button id="zout" title="Zoom out (-)" aria-label="Zoom out">&minus;</button>
        <span id="zoom">100%</span>
        <button id="zin" title="Zoom in (+)" aria-label="Zoom in">+</button>
        <button id="fit" title="Fit office to view (0)">FIT</button>
        <button id="one" title="Actual size">1:1</button>
      </div>
    </div>
